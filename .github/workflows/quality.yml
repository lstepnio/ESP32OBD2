name: Foundation quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py
      - run: node --check design/prototype/app.js
      - name: ELM parser fixtures with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/gauge/main/inc \
            firmware/gauge/tests/elm_response_test.c \
            firmware/gauge/main/src/elm_response.c \
            -o /tmp/elm_response_test
          /tmp/elm_response_test
      - name: Core firmware logic fixtures with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/gauge/tests/stubs -Ifirmware/gauge/main/inc \
            firmware/gauge/tests/core_logic_test.c \
            firmware/gauge/main/src/alert_engine.c \
            firmware/gauge/main/src/config_trial_policy.c \
            firmware/gauge/main/src/json_guard.c \
            firmware/gauge/main/src/pid_decoder.c \
            firmware/gauge/main/src/poll_scheduler.c \
            firmware/gauge/main/src/wifi_bulk_policy.c \
            -lm -o /tmp/core_logic_test
          /tmp/core_logic_test
  firmware-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gauge firmware
        shell: bash
        working-directory: firmware/gauge
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

  ios-core-parity:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Swift against shared runtime fixtures
        run: swift test --package-path ios/EGaugeCore
      - name: Check iOS design colors
        run: python3 tools/generate_ios_tokens.py --check
      - name: Build native iOS app for Simulator
        run: xcodebuild -project ios/eGauge.xcodeproj -scheme eGauge -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint, and test Android app
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon

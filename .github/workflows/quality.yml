name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py
      - run: node --check design/prototype/app.js
  firmware-baseline:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build imported baseline
        shell: bash
        working-directory: firmware/gauge
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D PROJECT_VER=0.1.0-baseline build

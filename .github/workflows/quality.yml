name: Foundation quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py
      - run: node --check design/prototype/app.js
      - name: ELM parser fixtures with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/gauge/main/inc \
            firmware/gauge/tests/elm_response_test.c \
            firmware/gauge/main/src/elm_response.c \
            -o /tmp/elm_response_test
          /tmp/elm_response_test
  firmware-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build gauge firmware
        shell: bash
        working-directory: firmware/gauge
        run: |
          . /opt/esp/idf/export.sh
          idf.py -D PROJECT_VER=0.1.0-baseline build

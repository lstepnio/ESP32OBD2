# Fixed, public GitHub metadata only. Cache protects the anonymous API allowance;
# stale successful metadata remains useful during upstream outages/rate limits.
proxy_cache_path /tmp/egauge-release-cache levels=1:2 keys_zone=egauge_releases:1m max_size=4m inactive=1h use_temp_path=off;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep directory redirects relative behind the HTTPS reverse proxy.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    location = /downloads/releases.json {
        limit_except GET { deny all; }
        proxy_pass https://api.github.com/repos/lstepnio/ESP32OBD2/releases?per_page=100;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent eGauge-recovery;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache egauge_releases;
        proxy_cache_key egauge-public-releases;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }
    location = /api/interest {
        proxy_pass http://egauge-interest:8081/interest;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        client_max_body_size 16k;
    }
    location = /api/custom {
        proxy_pass http://egauge-interest:8081/custom;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        client_max_body_size 16k;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}

  egauge:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:ed04ec1ff34502c339ee5c3ae3f855442398edc1d05591e2b98981dcbbd20b1e
    container_name: egauge
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /docker/appdata/egauge/site:/usr/share/nginx/html:ro
      - /docker/appdata/egauge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy
    labels:
      caddy: egauge.majjix.com
      caddy.reverse_proxy: "{{upstreams 8080}}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  egauge-interest:
    user: "1000:1000"
    image: python:3.12-alpine
    container_name: egauge-interest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INTEREST_DB: /data/interest.sqlite3
      SITE_ORIGIN: https://egauge.majjix.com
    command: ["python", "-B", "/app/server.py"]
    volumes:
      - /docker/appdata/egauge/interest-api/server.py:/app/server.py:ro
      - /docker/appdata/egauge/private:/data
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

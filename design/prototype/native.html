<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>eGauge · Native screen review</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #141717;
        color: #f2f4ef;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: #141717f5;
        padding: 20px 28px;
        border-bottom: 1px solid #394036;
        z-index: 1;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 24px;
        margin: 0;
      }
      p {
        margin: 0;
        color: #b8c0b5;
      }
      a {
        color: #d4ff62;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        padding: 12px;
        border-radius: 12px;
        background: #272b2c;
        color: white;
        font: inherit;
        border: 1px solid #63705d;
      }
      .gallery {
        padding: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 28px;
        align-items: start;
      }
      figure {
        margin: 0;
      }
      figure[hidden] {
        display: none;
      }
      figcaption {
        font-weight: 600;
        padding-bottom: 10px;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #63705d;
        border-radius: 18px;
      }
      body.expanded .gallery {
        grid-template-columns: repeat(auto-fit, minmax(580px, 1fr));
      }
      @media (max-width: 640px) {
        body.expanded .gallery {
          grid-template-columns: 1fr;
        }
        header {
          position: relative;
        }
      }
    </style>
  </head>

    <script>
      const theme = document.querySelector("#theme"),
        layout = document.querySelector("#layout");
      function filter() {
        document.body.classList.toggle("expanded", layout.value === "1000");
        document
          .querySelectorAll("figure")
          .forEach(
            (f) =>
              (f.hidden =
                f.dataset.theme !== theme.value ||
                f.dataset.width !== layout.value),
          );
      }
      theme.addEventListener("change", filter);
      layout.addEventListener("change", filter);
      filter();
    </script>

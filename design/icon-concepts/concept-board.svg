<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#F3F1EA"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#182019}.muted{fill:#626A60}.label{font-size:12px;letter-spacing:1.8px;font-weight:700}</style><text x="60" y="66" font-size="26" font-weight="700" letter-spacing="-1">eGauge.</text><text x="1380" y="63" text-anchor="end" class="label">APP ICON / CONCEPT REVIEW</text><text x="60" y="137" font-size="48" letter-spacing="-2">One brand. Three directions.</text><text x="60" y="178" font-size="18" class="muted">Circular instrument forms. Graphite and lime from the app. Simple enough for the home screen.</text><rect x="60" y="220" width="428" height="628" rx="22" fill="#FAF9F5" stroke="#839960"/><text x="86" y="258" class="label">A / RECOMMENDED</text><g transform="translate(164 292) scale(2.037037037037037)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32.1 75.9 A31 31 0 1 1 75.9 75.9"/><path d="M54 54 L72 36"/><circle cx="54" cy="54" r="4.5" fill="currentColor" stroke="none"/></g></g><text x="86" y="565" font-size="29" font-weight="700" letter-spacing="-0.7">Precision gauge</text><text x="86" y="603" font-size="15" class="muted">The clearest evolution of the existing mark.</text><text x="86" y="627" font-size="15" class="muted">Instantly reads as a vehicle instrument.</text><path d="M86 656 H462" stroke="#E0E3D9"/><text x="86" y="690" class="label muted">SMALL SIZE &amp; MASK EXPLORATIONS</text><g transform="translate(86 718) scale(0.4444444444444444)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32.1 75.9 A31 31 0 1 1 75.9 75.9"/><path d="M54 54 L72 36"/><circle cx="54" cy="54" r="4.5" fill="currentColor" stroke="none"/></g></g><g transform="translate(164 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32.1 75.9 A31 31 0 1 1 75.9 75.9"/><path d="M54 54 L72 36"/><circle cx="54" cy="54" r="4.5" fill="currentColor" stroke="none"/></g></g><g transform="translate(242 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#DFE4D8"/><g fill="none" color="#26352C" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32.1 75.9 A31 31 0 1 1 75.9 75.9"/><path d="M54 54 L72 36"/><circle cx="54" cy="54" r="4.5" fill="currentColor" stroke="none"/></g></g><g transform="translate(326 726) scale(0.2962962962962963)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32.1 75.9 A31 31 0 1 1 75.9 75.9"/><path d="M54 54 L72 36"/><circle cx="54" cy="54" r="4.5" fill="currentColor" stroke="none"/></g></g><text x="86" y="801" font-size="13" class="muted">48 px</text><text x="164" y="801" font-size="13" class="muted">Circle</text><text x="242" y="801" font-size="13" class="muted">Themed</text><text x="326" y="801" font-size="13" class="muted">32 px</text><rect x="506" y="220" width="428" height="628" rx="22" fill="#FAF9F5" stroke="#D9DDD2"/><text x="532" y="258" class="label">B / MOST DISTINCTIVE</text><g transform="translate(610 292) scale(2.037037037037037)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M80.8 69.5 A31 31 0 1 1 85 54 H31"/></g></g><text x="532" y="565" font-size="29" font-weight="700" letter-spacing="-0.7">Electric e</text><text x="532" y="603" font-size="15" class="muted">A single circular stroke becomes the letter e.</text><text x="532" y="627" font-size="15" class="muted">A stronger monogram, with a softer gauge cue.</text><path d="M532 656 H908" stroke="#E0E3D9"/><text x="532" y="690" class="label muted">SMALL SIZE &amp; MASK EXPLORATIONS</text><g transform="translate(532 718) scale(0.4444444444444444)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M80.8 69.5 A31 31 0 1 1 85 54 H31"/></g></g><g transform="translate(610 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M80.8 69.5 A31 31 0 1 1 85 54 H31"/></g></g><g transform="translate(688 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#DFE4D8"/><g fill="none" color="#26352C" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M80.8 69.5 A31 31 0 1 1 85 54 H31"/></g></g><g transform="translate(772 726) scale(0.2962962962962963)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M80.8 69.5 A31 31 0 1 1 85 54 H31"/></g></g><text x="532" y="801" font-size="13" class="muted">48 px</text><text x="610" y="801" font-size="13" class="muted">Circle</text><text x="688" y="801" font-size="13" class="muted">Themed</text><text x="772" y="801" font-size="13" class="muted">32 px</text><rect x="952" y="220" width="428" height="628" rx="22" fill="#FAF9F5" stroke="#D9DDD2"/><text x="978" y="258" class="label">C / MOST DATA-FOCUSED</text><g transform="translate(1056 292) scale(2.037037037037037)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29.3 73 A31 31 0 1 1 78.7 73"/><path d="M41 65 V58 M54 65 V48 M67 65 V38"/></g></g><text x="978" y="565" font-size="29" font-weight="700" letter-spacing="-0.7">Digital dial</text><text x="978" y="603" font-size="15" class="muted">An instrument arc frames three rising bars.</text><text x="978" y="627" font-size="15" class="muted">Connects the hardware to live vehicle data.</text><path d="M978 656 H1354" stroke="#E0E3D9"/><text x="978" y="690" class="label muted">SMALL SIZE &amp; MASK EXPLORATIONS</text><g transform="translate(978 718) scale(0.4444444444444444)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29.3 73 A31 31 0 1 1 78.7 73"/><path d="M41 65 V58 M54 65 V48 M67 65 V38"/></g></g><g transform="translate(1056 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29.3 73 A31 31 0 1 1 78.7 73"/><path d="M41 65 V58 M54 65 V48 M67 65 V38"/></g></g><g transform="translate(1134 718) scale(0.4444444444444444)"><circle cx="54" cy="54" r="54" fill="#DFE4D8"/><g fill="none" color="#26352C" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29.3 73 A31 31 0 1 1 78.7 73"/><path d="M41 65 V58 M54 65 V48 M67 65 V38"/></g></g><g transform="translate(1218 726) scale(0.2962962962962963)"><rect width="108" height="108" rx="25" fill="#0C1114"/><g fill="none" color="#B7F36B" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29.3 73 A31 31 0 1 1 78.7 73"/><path d="M41 65 V58 M54 65 V48 M67 65 V38"/></g></g><text x="978" y="801" font-size="13" class="muted">48 px</text><text x="1056" y="801" font-size="13" class="muted">Circle</text><text x="1134" y="801" font-size="13" class="muted">Themed</text><text x="1218" y="801" font-size="13" class="muted">32 px</text><circle cx="71" cy="902" r="11" fill="#0C1114"/><text x="94" y="908" font-size="15">Graphite #0C1114</text><circle cx="301" cy="902" r="11" fill="#B7F36B"/><text x="324" y="908" font-size="15">Lime #B7F36B</text><text x="1380" y="908" text-anchor="end" font-size="15" class="muted">Concept previews only; launcher assets follow selection.</text><text x="60" y="956" font-size="15" class="muted">Recommendation: A keeps continuity with the website favicon and makes the app recognizable at a glance.</text></svg>